[project]
name = "dessem-dashboard"
version = "0.1.0"
description = "Interactive offline HTML dashboard comparing DESSEM synthesis results across scenarios."
requires-python = ">=3.12"
dependencies = [
  "pandas>=3.0",
  "pyarrow>=17",
  "plotly>=6",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  # pandas ships no py.typed marker, so mypy --strict cannot see through `import pandas`.
  # These stubs give the data layer real DataFrame/Series types instead of Any.
  "pandas-stubs>=3.0",
  # The synthetic Parquet fixtures seed numpy's default_rng for reproducible values. numpy arrives
  # transitively with pandas, but the test helpers import it directly, so it is declared here.
  "numpy>=2.0",
]

[project.scripts]
dessem-dashboard = "dessem_dashboard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dessem_dashboard.dashboard.assets" = ["*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit rule set: ruff's default (E4, E7, E9, F) is narrower than this project needs.
# Rules deliberately NOT selected, because they contradict binding plan decisions rather than
# reveal defects: TRY003 (error messages must name the offending settings key, planning-context
# decision 2), PLC0415 (the rich import is guarded inside try/except by design, ticket-004),
# T201 (the stderr print for an invalid settings.json is specified by ticket-006), PLR2004
# (literal comparisons are intentional in tests).
select = [
  "A",    # builtin shadowing
  "ANN",  # missing type annotations
  "ARG",  # unused arguments
  "B",    # bugbear
  "C4",   # comprehensions
  "DTZ",  # naive datetimes
  "E",    # pycodestyle errors
  "ERA",  # commented-out code
  "F",    # pyflakes
  "I",    # import sorting
  "ICN",  # import conventions
  "ISC",  # implicit string concatenation
  "N",    # naming
  "PT",   # pytest style
  "PTH",  # pathlib over os.path
  "Q",    # quote consistency
  "RUF",  # ruff-specific
  "SIM",  # simplification
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=dessem_dashboard --cov-report=term-missing"
testpaths = ["tests"]
